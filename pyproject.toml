[project]
name = "momentum-edge"
version = "0.1.0"
description = "Automated NSE stock scanning and ranking using Minervini Trend Template + CANSLIM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "boto3>=1.42.71",
    "fastapi>=0.135.1",
    "hatchling>=1.29.0",
    "httpx>=0.28.1",
    "jugaad-data>=0.33.1",
    "loguru>=0.7.3",
    "numpy>=2.4.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "psycopg2-binary>=2.9.11",
    "pyjwt[crypto]>=2.10.1",
    "pyarrow>=23.0.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "python-dotenv>=1.2.2",
    "resend>=2.25.0",
    "rich>=14.3.3",
    "rich-click>=1.9.7",
    "sqlalchemy>=2.0.48",
    "uvicorn[standard]>=0.42.0",
    "yfinance>=1.2.0",
]

[project.scripts]
momentum-edge = "momentum_edge.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/momentum_edge"]
